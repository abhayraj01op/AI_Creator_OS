# AI CREATOR OS — GLOBAL SYSTEM CONFIGURATION
version: "1.0.0"
owner: "abhayraj01op"
system_name: "AI Creator OS"

storage:
  drive_mount_path: "/content/drive/MyDrive"
  os_root: "/content/drive/MyDrive/AI_Creator_OS"
  local_temp_cache: "/content/temp_cache"
  auto_create_dirs: true
  enable_5tb_structure: true

compute:
  gpu_preference: "auto"       # auto | cuda | cpu
  default_precision: "fp16"    # fp32 | fp16 | bf16 | int8 | int4
  cpu_threads: 4
  vram_reserve_mb: 1024

network:
  gradio_share: true
  gradio_server_port: 7860
  gradio_auth_enabled: false

download:
  auto_resume: true
  verify_sha256: true
  chunk_size_kb: 8192
  max_retries: 3

logging:
  level: "INFO"                # DEBUG | INFO | WARNING | ERROR
  save_to_drive: true
  mirror_stdout: true
