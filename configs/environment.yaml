# AI CREATOR OS — ENVIRONMENT & HARDWARE TIERS
tiers:
  HIGH:
    min_vram_gb: 23.0
    recommended_gpus: ["A100-SXM4-40GB", "A100-SXM4-80GB", "L4-24GB", "RTX 4090"]
    precision: "bf16"
    batch_size_multiplier: 2.0
    enable_flash_attention: true
  MEDIUM:
    min_vram_gb: 14.0
    recommended_gpus: ["T4-16GB", "V100-16GB"]
    precision: "fp16"
    batch_size_multiplier: 1.0
    enable_xformers: true
  LOW:
    min_vram_gb: 7.5
    recommended_gpus: ["T4-15GB", "RTX 3060", "GTX 1080Ti"]
    precision: "fp16"
    enable_sequential_cpu_offload: true
    enable_vae_tiling: true
  CPU_ONLY:
    min_vram_gb: 0.0
    precision: "fp32"
    quantization: "int8"
    threads: 4
